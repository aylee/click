name: Check

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Preinstalled in GitHub's macOS 15 image; includes Swift 6.1.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build, test, and check privacy
        run: Scripts/check.sh
      - name: Validate release package
        run: |
          Scripts/package_app.sh release
          unzip -tq build/Click-macOS.zip
